[package]
name = "bmol-designs"
version = "0.1.5"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
authors = ["Erizeez <zhangyongcheng@sjtu.edu.cn>"]
repository = "https://github.com/Erizeez/bmol-designs"
homepage = "https://github.com/Erizeez/bmol-designs"
description = "Framework-agnostic Apple-inspired design tokens, glass theme metrics, and styling primitives."
readme = "README.md"
keywords = ["design-system", "design-tokens", "liquid-glass", "squircle", "macos"]
categories = ["gui"]

[dependencies]
liquid-rs = { git = "https://github.com/Erizeez/liquid-rs", branch = "main" }
# `UiTheme::physical_glass_material` resolves a content-glass recipe per role.
liquid-glass-render = { git = "https://github.com/Erizeez/liquid-rs", branch = "main" }
squircle-rs = { git = "https://github.com/Erizeez/squircle-rs", tag = "v0.1.2" }
iced = { version = "0.14.0", default-features = false, features = ["thread-pool"], optional = true }

[features]
# The toolkit-facing adapters: `UiColorScheme::from_mode`, `UiTheme::from_iced`,
# `UiTheme::iced_theme` and `to_iced`. Everything else is toolkit-free.
iced = ["dep:iced"]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
float_cmp = "allow"

[profile.dev]
opt-level = 2
