[package]
name = "bmol-designs"
version = "0.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
authors = ["Erizeez <zhangyongcheng@sjtu.edu.cn>"]
repository = "https://github.com/Erizeez/bmol-designs"
homepage = "https://github.com/Erizeez/bmol-designs"
description = "Framework-agnostic Apple-inspired design tokens, glass theme metrics, and styling primitives."
readme = "README.md"
keywords = ["design-system", "design-tokens", "liquid-glass", "squircle", "macos"]
categories = ["gui"]

[dependencies]
liquid-rs = { git = "https://github.com/Erizeez/liquid-rs", tag = "v0.1.2" }
squircle-rs = { git = "https://github.com/Erizeez/squircle-rs", tag = "v0.1.2" }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
float_cmp = "allow"

[profile.dev]
opt-level = 2
